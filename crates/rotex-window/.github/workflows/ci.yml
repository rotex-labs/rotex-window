name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          set -euo pipefail
          if cargo metadata --all-features --format-version 1 >/tmp/cargo-metadata.json 2>/tmp/cargo-metadata.err; then
            cargo clippy --all-targets --all-features -- -D warnings
          elif grep -q 'failed to select a version for the requirement `rotex-' /tmp/cargo-metadata.err; then
            echo "Clippy skipped: a Rotex dependency is not on crates.io at the required version yet."
            cat /tmp/cargo-metadata.err
          else
            cat /tmp/cargo-metadata.err
            exit 1
          fi

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Check unused dependencies
        run: cargo machete
